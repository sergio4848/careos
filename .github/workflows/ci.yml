name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: careos
          POSTGRES_PASSWORD: careos-ci
          POSTGRES_DB: careos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careos" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CAREOS_ENVIRONMENT: test
      CAREOS_SECRET_KEY: ci-only-secret-key-0123456789-0123456789
      CAREOS_DATABASE_URL: postgresql+asyncpg://careos:careos-ci@localhost:5432/careos
      CAREOS_TEST_DATABASE_URL: postgresql+asyncpg://careos:careos-ci@localhost:5432/careos_test
      CAREOS_REDIS_URL: ""
      # Real Redis for tests/integration/test_redis_integration.py (skipped when unset).
      CAREOS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Create test database
        run: PGPASSWORD=careos-ci psql -h localhost -U careos -d careos -c "CREATE DATABASE careos_test;"
      - name: Migrations apply, roll back and match the models
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Seed demo data (idempotent)
        env:
          CAREOS_ENVIRONMENT: development
          CAREOS_SEED_DEMO_PASSWORD: ci-demo-password-123
          CAREOS_SIMULATOR_GATEWAY_KEY: cgk_demo0001_ci-simulator-secret-value-0001
        run: |
          python -m careos.cli seed-demo
          python -m careos.cli seed-demo
      - name: Unit tests
        run: pytest tests/unit --cov --cov-report=
      - name: Integration tests (PostgreSQL + Redis, failure injection, invariants, security)
        run: pytest tests/integration --cov --cov-append --cov-report=term-missing:skip-covered

  contracts:
    name: Contracts · generated artefacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Regenerate
        env:
          CAREOS_SECRET_KEY: ci-only-secret-key-0123456789-0123456789
          CAREOS_REDIS_URL: ""
        run: |
          pip install -e "apps/backend"
          (cd apps/backend && python -m careos.cli export-contracts)
          npm ci --no-audit --no-fund
          npm run contracts:generate
      - name: Fail on drift
        run: git diff --exit-code -- packages/contracts

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker · compose stack boots and is healthy
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:8000/ready
          curl --fail --silent --output /dev/null http://localhost:3000/login
      - name: Backend tests inside the image
        run: docker compose run --rm api pytest -q
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
